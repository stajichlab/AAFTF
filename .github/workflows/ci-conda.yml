# Tests the conda route: builds environment.yml (the tools the pipelines need with their default settings, from
# bioconda/conda-forge), installs this checkout of AAFTF into it in place of the PyPI release the file names, and runs
# the whole test suite there, so environment.yml can't drift from pyproject.toml and pixi.toml unnoticed. Integration
# tests whose tools environment.yml leaves out skip themselves. Uses the org's shared python_test_conda workflow.

name: CI/conda

on:
  push:
    branches: [main]
    paths: ["**.py", "pyproject.toml", "environment.yml", ".github/workflows/ci-conda.yml"]
  pull_request:
    paths: ["**.py", "pyproject.toml", "environment.yml", ".github/workflows/ci-conda.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-conda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (conda environment.yml)
    uses: stajichlab/gh_workflows/.github/workflows/python_test_conda.yml@v2
    with:
      environment_file: environment.yml
      python_versions: '[""]'  # use the Python environment.yml pins
      # replace the PyPI release from environment.yml with this checkout, check the default pipeline's tools, then test
      test_command: |
        python -m pip install -e ".[dev]"
        AAFTF dependency
        pytest -vv tests
