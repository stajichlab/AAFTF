# Builds and publishes the AAFTF container images.
#
# - Every push to main:      rebuilds the Docker image and publishes it as
#                             ghcr.io/stajichlab/aaftf:latest / :main
# - Every published release: builds the Docker image pinned to that tag and
#                             publishes ghcr.io/stajichlab/aaftf:<tag> / :<version>,
#                             plus builds a Singularity/Apptainer .sif for that
#                             tag (without baking in the sourmash DB) and
#                             attaches it to the GitHub Release as an asset.
#
# All images are signed with Cosign (Sigstore) and include SLSA provenance
# attestations for supply-chain security.

name: Build container images

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stajichlab/aaftf

jobs:
  docker-main:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          sha=$(git rev-parse --short HEAD)
          raw=$(git describe --tags --long --match='v[0-9]*' 2>/dev/null || echo "")
          if [ -n "$raw" ]; then
            # Convert v0.7.0-<n>-g<hash>[-dirty] to PEP 440: 0.7.0.dev<n>+g<hash>[.dirty]
            v=$(echo "$raw" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)-g([0-9a-f]+)(-dirty)?$/\1.dev\2+g\3\4/' \
                            | sed 's/-dirty$/.dirty/')
          fi
          # If sed did not match (unexpected tag format) or no tags, fall back to a safe dev version
          if [ -z "${v:-}" ] || ! echo "${v}" | grep -qE '^[0-9]'; then
            v="0.0.0.dev0+g${sha}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            AAFTF_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tags
        id: meta
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            AAFTF_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  singularity-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apptainer

      - name: Build .sif for the released tag
        run: |
          tag="${{ github.event.release.tag_name }}"
          apptainer build \
            --build-arg git_ref="${tag}" \
            --build-arg skip_db_download=1 \
            "AAFTF-${tag}.sif" AAFTF.def

      - name: Attach .sif to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          gh release upload "${tag}" "AAFTF-${tag}.sif" --clobber --repo "${{ github.repository }}"

  docker-sign:
    needs: [docker-main, docker-release]
    runs-on: ubuntu-latest
    if: always() && (contains(needs.docker-main.result, 'success') || contains(needs.docker-release.result, 'success'))
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign main/latest images
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          for tag in latest main; do
            cosign sign --yes \
              --recursive \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}"
          done

      - name: Compute release tags
        if: github.event_name == 'release'
        id: meta
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Sign release images
        if: github.event_name == 'release'
        run: |
          for t in "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.version }}"; do
            cosign sign --yes \
              --recursive \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${t}"
          done

  provenance:
    needs: [docker-main, docker-release, docker-sign]
    runs-on: ubuntu-latest
    if: always() && (contains(needs.docker-main.result, 'success') || contains(needs.docker-release.result, 'success'))
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SLSA provenance predicate
        id: slsa-predicate
        run: |
          started_on="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          predicate_file="${RUNNER_TEMP}/slsa-provenance.json"
          cat > "${predicate_file}" <<JSON
          {
            "buildDefinition": {
              "buildType": "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-build.yml",
              "externalParameters": {},
              "internalParameters": {},
              "resolvedDependencies": []
            },
            "runDetails": {
              "builder": {
                "id": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              },
              "metadata": {
                "invocationId": "${GITHUB_RUN_ID}",
                "startedOn": "${started_on}"
              },
              "byproducts": []
            }
          }
          JSON
          echo "path=${predicate_file}" >> "${GITHUB_OUTPUT}"

      - name: Generate SLSA provenance for main/latest
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          for tag in latest main; do
            cosign attest --yes \
              --predicate "${{ steps.slsa-predicate.outputs.path }}" \
              --type=slsaprovenance1 \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}"
          done

      - name: Compute release tags
        if: github.event_name == 'release'
        id: meta
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Generate SLSA provenance for release images
        if: github.event_name == 'release'
        run: |
          for t in "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.version }}"; do
            cosign attest --yes \
              --predicate "${{ steps.slsa-predicate.outputs.path }}" \
              --type=slsaprovenance1 \
              "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${t}"
          done
