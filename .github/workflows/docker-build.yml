# Builds and publishes the AAFTF container images with the org's shared container_build workflow, which also signs
# them (sign: true); the Apptainer smoke test stays here.
#
# - Release (called by publish.yml with the new tag): publishes ghcr.io/stajichlab/aaftf:<version>, :<tag>,
#                             :<major.minor> and :latest (the last two not for prereleases). No .sif
#                             is published: users convert the image with `apptainer pull docker://...`, which
#                             the apptainer-test job checks.
#
# - Manual run (workflow_dispatch): builds the current branch as
#                             ghcr.io/stajichlab/aaftf:main, to test an image before releasing; with the
#                             `tag` input, rebuilds that release exactly as above (e.g. after a failed release
#                             build). Rebuilding an older release also moves :latest to it.
#
# Each build is one multi-platform index (the linux/amd64 image plus the SLSA provenance attestation that buildx
# attaches) signed once with Cosign (Sigstore) by its index digest, so the registry holds one signature tag,
# sha256-<index digest>, per build. The signing runs inside the shared workflow, so the certificate identity is
# gh_workflows' container_build.yml; the repository it built for is checked separately. Verify with:
#   cosign verify ghcr.io/stajichlab/aaftf:<tag> \
#     --certificate-identity-regexp '^https://github.com/stajichlab/gh_workflows/.github/workflows/container_build.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-github-workflow-repository stajichlab/AAFTF

name: Build container images

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.7.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild (e.g. v0.8.0-beta.0); empty builds the current branch as :main"
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stajichlab/aaftf

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0  # full history for the version, without old file contents

      - name: Compute version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        # A release builds its tag's version; a manual run uses the raw `git describe` output (e.g.
        # v0.7.0-beta.4-63-g7c3c423), which the Dockerfile converts to PEP 440 (0.7.0-beta.4-63+g7c3c423). The build
        # fails if the installed version differs.
        run: |
          if [ -n "$TAG" ]; then
            v="${TAG#v}"
          else
            v=$(git describe --tags --long --match='v[0-9]*' 2>/dev/null || echo "0.0.0+g$(git rev-parse --short HEAD)")
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"

  docker:
    needs: version
    uses: stajichlab/gh_workflows/.github/workflows/container_build.yml@v2
    permissions:
      contents: read
      packages: write
      id-token: write  # keyless Cosign signing (sign: true)
    with:
      ref: ${{ inputs.tag }}
      latest: ${{ inputs.tag != '' }}  # ignored for prereleases
      extra_tags: ${{ inputs.tag || 'main' }}
      build_args: |
        AAFTF_VERSION=${{ needs.version.outputs.version }}
      smoke_test_args: AAFTF --version
      # sign the pushed index once (not its platform/attestation manifests); stored as tag sha256-<index digest>
      sign: true

  apptainer-test:
    # Users run the published Docker image on HPC via `apptainer pull docker://...`; check that the converted
    # image works, including in login shells (SLURM/Nextflow run task scripts with `bash -l`).
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Install Apptainer
        # Not in Ubuntu's default archive: install from the Apptainer project's PPA
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apptainer

      - name: Pull and smoke-test the image
        env:
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apptainer pull aaftf.sif "docker://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.digest }}"
          apptainer exec aaftf.sif AAFTF --version
          apptainer exec aaftf.sif bash -lc 'AAFTF --version'
