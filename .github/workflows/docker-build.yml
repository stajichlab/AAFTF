# Builds and publishes the AAFTF container images. The Docker build itself uses the org's shared container_build
# workflow; signing, provenance and the Singularity image stay here.
#
# - Release (called by publish.yml with the new tag): publishes ghcr.io/stajichlab/aaftf:<version>, :<tag>,
#                             :<major.minor> and :latest (the last two not for prereleases), plus builds a
#                             Singularity/Apptainer .sif for that tag (without baking in the sourmash DB) and
#                             attaches it to the GitHub Release as an asset.
#
# - Manual run (workflow_dispatch): builds the current branch as
#                             ghcr.io/stajichlab/aaftf:main, to test an image before releasing.
#
# All images are signed with Cosign (Sigstore) and include SLSA provenance
# attestations for supply-chain security.

name: Build container images

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.7.0)"
        required: true
        type: string
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stajichlab/aaftf

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0  # full history for the version, without old file contents

      - name: Compute version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        # A release builds its tag's version; a manual run uses the raw `git describe` output (e.g.
        # v0.7.0-beta.4-63-g7c3c423), which the Dockerfile converts to PEP 440 (0.7.0-beta.4-63+g7c3c423). The build
        # fails if the installed version differs.
        run: |
          if [ -n "$TAG" ]; then
            v="${TAG#v}"
          else
            v=$(git describe --tags --long --match='v[0-9]*' 2>/dev/null || echo "0.0.0+g$(git rev-parse --short HEAD)")
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"

  docker:
    needs: version
    uses: stajichlab/gh_workflows/.github/workflows/container_build.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ inputs.tag }}
      latest: ${{ inputs.tag != '' }}  # ignored for prereleases
      extra_tags: ${{ inputs.tag || 'main' }}
      build_args: |
        AAFTF_VERSION=${{ needs.version.outputs.version }}
      smoke_test_args: AAFTF --version

  docker-sign:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: sigstore/cosign-installer@v4.1.2

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the image
        run: |
          cosign sign --yes \
            --recursive \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.digest }}"

  singularity-release:
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apptainer

      - name: Build .sif for the released tag
        run: |
          tag="${{ inputs.tag }}"
          apptainer build \
            --build-arg git_ref="${tag}" \
            --build-arg skip_db_download=1 \
            "AAFTF-${tag}.sif" AAFTF.def

      - name: Attach .sif to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ inputs.tag }}"
          gh release upload "${tag}" "AAFTF-${tag}.sif" --clobber --repo "${{ github.repository }}"

  provenance:
    needs: [docker, docker-sign]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
    steps:
      - uses: sigstore/cosign-installer@v4.1.2

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SLSA provenance predicate
        id: slsa-predicate
        run: |
          started_on="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          predicate_file="${RUNNER_TEMP}/slsa-provenance.json"
          cat > "${predicate_file}" <<JSON
          {
            "buildDefinition": {
              "buildType": "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/docker-build.yml",
              "externalParameters": {},
              "internalParameters": {},
              "resolvedDependencies": []
            },
            "runDetails": {
              "builder": {
                "id": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              },
              "metadata": {
                "invocationId": "${GITHUB_RUN_ID}",
                "startedOn": "${started_on}"
              },
              "byproducts": []
            }
          }
          JSON
          echo "path=${predicate_file}" >> "${GITHUB_OUTPUT}"

      - name: Generate SLSA provenance
        run: |
          cosign attest --yes \
            --predicate "${{ steps.slsa-predicate.outputs.path }}" \
            --type=slsaprovenance1 \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.digest }}"
