name: CD/Release
run-name: |
  Publish release - ${{ github.event.inputs.bump_type }}
  ${{ startsWith(github.event.inputs.bump_type, 'pre') && github.event.inputs.preid || '' }}

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump types"
        required: true
        type: choice
        default: "patch"
        options:
          - major
          - premajor
          - minor
          - preminor
          - patch
          - prepatch
          - prerelease
      preid:
        description: "Prerelease identifier"
        type: string

jobs:
  prepare-release:
    name: Bump version, changelog and citation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-info.outputs.version }}
      release_notes: ${{ steps.release-info.outputs.release-notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version and update release metadata
        id: release-info
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          PREID: ${{ github.event.inputs.preid }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from datetime import date

          bump_type = os.environ["BUMP_TYPE"]
          preid_input = (os.environ.get("PREID") or "").strip()


          def parse(v):
              """Split a vX.Y.Z or vX.Y.Z-<id>.<n> tag into ([X, Y, Z], (id, n) or None)."""
              m = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z]+)\.(\d+))?", v.strip())
              if not m:
                  raise SystemExit(f"cannot parse version from {v!r}")
              core = [int(x) for x in m.group(1, 2, 3)]
              return core, ((m.group(4), int(m.group(5))) if m.group(4) else None)


          def fmt(v):
              return ".".join(map(str, v))


          res = subprocess.run(
              ["git", "describe", "--tags", "--abbrev=0", "--match", "v[0-9]*"],
              capture_output=True,
              text=True,
          )
          if res.returncode != 0:
              raise SystemExit("no git tags found; cannot compute the next version")
          (major, minor, patch), current_pre = parse(res.stdout)
          # no identifier given: keep the current prerelease's (e.g. beta), else "alpha"
          preid = preid_input or (current_pre[0] if current_pre else "alpha")

          # npm-style semver bumps. From a prerelease (e.g. 0.7.0-beta.4): major/minor/patch
          # release the version it leads up to when that is the right level (0.7.0), and
          # prerelease bumps its counter (0.7.0-beta.5, or 0.7.0-<preid>.0 for a new preid).
          pre = ""
          if bump_type == "major":
              if not (current_pre and minor == 0 and patch == 0):
                  major, minor, patch = major + 1, 0, 0
          elif bump_type == "minor":
              if not (current_pre and patch == 0):
                  minor, patch = minor + 1, 0
          elif bump_type == "patch":
              if not current_pre:
                  patch += 1
          elif bump_type == "premajor":
              major, minor, patch, pre = major + 1, 0, 0, f"-{preid}.0"
          elif bump_type == "preminor":
              minor, patch, pre = minor + 1, 0, f"-{preid}.0"
          elif bump_type == "prepatch":
              patch, pre = patch + 1, f"-{preid}.0"
          elif bump_type == "prerelease":
              if current_pre is None:
                  patch, pre = patch + 1, f"-{preid}.0"
              elif current_pre[0] == preid:
                  pre = f"-{preid}.{current_pre[1] + 1}"
              else:
                  pre = f"-{preid}.0"
          else:
              raise SystemExit(f"unsupported bump_type: {bump_type}")

          version = fmt([major, minor, patch]) + pre
          today = date.today().isoformat()

          if os.path.exists("CITATION.cff"):
              txt = open("CITATION.cff").read()
              txt = re.sub(r"(?m)^version: .*$", f"version: {version}", txt)
              txt = re.sub(r"(?m)^date-released: .*$", f"date-released: {today}", txt)
              open("CITATION.cff", "w").write(txt)

          # Retitle the top "(Development)" section to the released version, use it as the release
          # notes, and start a fresh empty "(Development)" section for the next release.
          label = "Pre-release" if pre else "Stable"
          changelog_edited = False
          if not os.path.exists("CHANGES.md"):
              raise SystemExit("CHANGES.md not found; add release notes under a '## ... (Development)' heading")
          txt = open("CHANGES.md").read()
          m = re.search(r"(?ms)^(# Changelog[^\n]*)\n\n## [^\n]+ \(Development\)[^\n]*\n(.*?)(?=^## |\Z)", txt)
          if not m:
              raise SystemExit(
                  "CHANGES.md has no '## ... (Development)' section right after '# Changelog'; "
                  "add the release notes there before releasing"
              )
          notes = m.group(2).strip()
          if not notes:
              raise SystemExit("the '(Development)' section in CHANGES.md is empty; add the release notes before releasing")
          released = f"## {version} ({label})\n\n{notes}\n\n"
          fresh = "## Unreleased (Development)\n\n"
          head = txt[: m.start()] + m.group(1) + "\n\n"
          txt = head + fresh + released + txt[m.end():]
          open("CHANGES.md", "w").write(txt)
          changelog_edited = True

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={version}\n")
              fh.write("release-notes<<_EOF_\n")
              fh.write(notes)
              fh.write("\n_EOF_\n")

          print(f"Release version: {version}")
          print(f"CITATION.cff bumped: {os.path.exists('CITATION.cff')}")
          print(f"CHANGES.md retitled: {changelog_edited}")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          # Only stage the files this workflow touches, never `git add .`
          git add CITATION.cff CHANGES.md 2>/dev/null || true
          git commit -m "Release v${{ steps.release-info.outputs.version }}"

      - name: Create Commit Patch
        run: |
          git format-patch -1 HEAD --stdout > release-commit.patch

      - name: Upload Patch Artifact
        uses: actions/upload-artifact@v6
        with:
          name: release-patch
          path: release-commit.patch

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download patch
        uses: actions/download-artifact@v7
        with:
          name: release-patch
          path: .

      - name: Apply commit patch and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git am release-commit.patch
          rm release-commit.patch
          git tag -f "v${{ needs.prepare-release.outputs.version }}" HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install build tool
        run: python -m pip install build

      - name: Build Source Distribution (sdist)
        run: python -m build --sdist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  test-unit:
    name: Unit tests (py ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: build-sdist
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]  # requires-python = ">=3.10,<3.15"

    steps:
      - name: Checkout test suite only
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            tests
            pyproject.toml
          sparse-checkout-cone-mode: true

      - name: Download sdist artifact
        uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install pytest and the package from sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest dist/*.tar.gz

      - name: Run unit tests (no external tools needed)
        run: |
          pytest -vv -m unit tests

  test-integration:
    name: Integration tests (real tools, locked pixi dev environment)
    runs-on: ubuntu-latest
    needs: prepare-release

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download patch
        uses: actions/download-artifact@v7
        with:
          name: release-patch
          path: .

      - name: Apply commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git am release-commit.patch
          rm release-commit.patch

      - name: Install the pixi dev environment (pixi.lock)
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: dev
          locked: true

      - name: Run integration tests (synthetic genome, small reads)
        run: pixi run -e dev pytest -vv -m integration tests

  publish-release:
    name: Publish Release - v${{ needs.prepare-release.outputs.version }}
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-sdist
      - test-unit
      - test-integration
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download patch
        uses: actions/download-artifact@v7
        with:
          name: release-patch
          path: .

      - name: Apply commit patch and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git am release-commit.patch
          rm release-commit.patch
          git tag -f "v${{ needs.prepare-release.outputs.version }}" HEAD

      - name: Push the updated commits
        run: |
          git push --follow-tags

      - name: Download sdist artifact
        uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ needs.prepare-release.outputs.release_notes }}
          tag_name: v${{ needs.prepare-release.outputs.version }}
          prerelease: ${{ startsWith(github.event.inputs.bump_type, 'pre') }}
          make_latest: ${{ !startsWith(github.event.inputs.bump_type, 'pre') }}
          files: dist/*.tar.gz
