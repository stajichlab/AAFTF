name: Container Retention Policy

on:
  schedule:
    - cron: "0 3 * * 1"  # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete untagged images older than 2 weeks
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: stajichlab
          account-type: org
          image-names: aaftf
          untagged-only: true
          cut-off: 2 weeks ago UTC
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep only latest beta/alpha release tag
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: stajichlab
          account-type: org
          image-names: aaftf
          tag-regex: "^.*(?:alpha|beta|b\\d).*$"
          keep-n-most-recent: 1
          token: ${{ secrets.GITHUB_TOKEN }}
