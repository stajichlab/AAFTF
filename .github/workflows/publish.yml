# Finishes a release when its `release/v<version>` pull request (opened by release.yml) is merged into main: the
# sdist is built and its unit tests run on every supported Python, the bioconda recipe is solved (recipe-solve.yml),
# then the org's shared release_publish workflow
# tags the merge commit and creates the GitHub release with the CHANGELOG.md notes and the tested sdist, the package
# is built from the tag and published to PyPI and ghcr.io, and main is merged back into dev (sync_dev). For stable
# releases, a pull request into dev then sets bioconda/meta.yaml's sha256 to the PyPI sdist's.
# Other closed pull requests do nothing.
#
# The publishing steps are chained here rather than triggered by `release: published`, which does not fire for
# releases created with GITHUB_TOKEN.

name: Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-sdist:
    name: Build sdist
    # only merged release PRs opened by release.yml; skipping here skips every job below
    if: github.event.pull_request.merged && startsWith(github.head_ref, 'release/v') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0  # full history for the version, without old file contents

      # The release tag does not exist yet; tag locally so hatch-vcs gives the release version
      - name: Tag release commit locally
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git tag "${HEAD_REF#release/}"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist
        run: pipx run build --sdist

      - name: Check the built version matches the release tag
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python -m pip install packaging
          python - "${HEAD_REF#release/v}" dist/*.tar.gz <<'PY'
          import sys
          from pathlib import Path
          from packaging.version import Version
          expected = Version(sys.argv[1])
          built = Version(Path(sys.argv[2]).name.removesuffix(".tar.gz").rsplit("-", 1)[1])
          if built != expected:
              sys.exit(f"built version {built} does not match release tag {expected}")
          print(f"built version {built} matches the release tag")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  test-sdist:
    name: Test sdist (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: build-sdist
    strategy:
      fail-fast: true
      matrix:
        python: ["3.11", "3.12", "3.13"]  # requires-python = ">=3.11,<3.14"

    steps:
      # tests and the pytest settings only, so the tests import the installed sdist rather than the checkout
      - name: Checkout test suite only
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tests
            pyproject.toml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install from sdist
        run: python -m pip install pytest dist/*.tar.gz

      # integration tests need the external tools; they run in ci.yml's pixi environment
      - name: Run unit tests (no external tools needed)
        run: pytest -m unit tests

  # the bioconda recipe's run requirements must install on every supported Python (as bioconda's CentOS 7 image)
  recipe-solve:
    needs: build-sdist  # skipped with it for pull requests that are not releases
    uses: ./.github/workflows/recipe-solve.yml

  publish:
    needs: [test-sdist, recipe-solve]
    uses: stajichlab/gh_workflows/.github/workflows/release_publish.yml@v2
    permissions:
      contents: write
    with:
      artifact: sdist  # attach the tested sdist to the GitHub release
      environment: Release  # required reviewers (Settings → Environments) approve tagging and publishing
    secrets:
      token: ${{ secrets.RELEASE_TOKEN }}

  pypi:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/python-publish.yml
    permissions:
      contents: write
      id-token: write
    with:
      tag: ${{ needs.publish.outputs.tag }}
      sdist_artifact: sdist  # publish the sdist test-sdist tested, with a wheel built from it
    secrets: inherit

  container:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/docker-build.yml
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      tag: ${{ needs.publish.outputs.tag }}

  # release.yml sets the bioconda recipe's version for stable releases, but its sha256 only exists once the sdist is
  # on PyPI: read it from there and open a pull request into dev updating bioconda/meta.yaml. (bioconda's autobump
  # bot updates the recipe in bioconda-recipes itself; this keeps the repo copy identical to it.)
  bioconda-sha256:
    needs: [publish, pypi]
    if: needs.publish.outputs.published == 'true' && needs.publish.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Get the sdist sha256 from PyPI
        id: pypi
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          version="${TAG#v}"
          # PyPI's JSON API can lag a few minutes behind the upload
          for i in $(seq 1 20); do
            sha=$(curl -fsSL "https://pypi.org/pypi/aaftf/${version}/json" \
              | jq -r '.urls[] | select(.packagetype == "sdist") | .digests.sha256' || true)
            [ -n "$sha" ] && break
            echo "sdist of ${version} not on PyPI yet (attempt ${i}); waiting 30 s"
            sleep 30
          done
          [ -n "$sha" ] || { echo "::error::No sdist for aaftf ${version} on PyPI"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha}" >> "$GITHUB_OUTPUT"

      - name: Update bioconda/meta.yaml and open a pull request into dev
        env:
          VERSION: ${{ steps.pypi.outputs.version }}
          SHA256: ${{ steps.pypi.outputs.sha256 }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          recipe=bioconda/meta.yaml
          # The release PR already set this version (and build number 0); dev gets it through sync-dev, which may
          # not have finished yet, so set it here too
          sed -i -E -e "s/^(\{% set version = \")[^\"]*(\" %\})/\1${VERSION}\2/" \
            -e "s/^(  number: )[0-9]+/\10/" -e "s/^(  sha256: )[0-9a-f]+/\1${SHA256}/" "$recipe"
          grep -q "set version = \"${VERSION}\"" "$recipe" && grep -q "sha256: ${SHA256}" "$recipe"
          if git diff --quiet -- "$recipe"; then
            echo "bioconda/meta.yaml on dev already has ${VERSION} and its sha256"
            exit 0
          fi
          branch="bioconda/v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "Update bioconda recipe to ${VERSION}" -- "$recipe"
          git push --force origin "$branch"
          gh pr create --base dev --head "$branch" \
            --title "Update bioconda recipe to ${VERSION}" \
            --body "Sets \`bioconda/meta.yaml\` to the released ${VERSION} with the sha256 of its PyPI sdist (\`${SHA256}\`). Copy the same change into \`recipes/aaftf/meta.yaml\` in bioconda-recipes if the autobump PR has not already done it."

  sync-dev:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: stajichlab/gh_workflows/.github/workflows/sync_dev.yml@v2
    permissions:
      contents: write
      pull-requests: write
