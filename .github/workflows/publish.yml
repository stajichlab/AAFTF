# Finishes a release when its `release/v<version>` pull request (opened by release.yml) is merged into main: the
# sdist is built and its unit tests run on every supported Python, then the org's shared release_publish workflow
# tags the merge commit and creates the GitHub release with the CHANGELOG.md notes and the tested sdist, the package
# is built from the tag and published to PyPI, anaconda.org and ghcr.io, and main is merged back into dev (sync_dev).
# Other closed pull requests do nothing.
#
# The publishing steps are chained here rather than triggered by `release: published`, which does not fire for
# releases created with GITHUB_TOKEN.

name: Publish

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-sdist:
    name: Build sdist
    # only merged release PRs opened by release.yml; skipping here skips every job below
    if: github.event.pull_request.merged && startsWith(github.head_ref, 'release/v') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0  # full history for the version, without old file contents

      # The release tag does not exist yet; tag locally so hatch-vcs gives the release version
      - name: Tag release commit locally
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: git tag "${HEAD_REF#release/}"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build sdist
        run: pipx run build --sdist

      - name: Check the built version matches the release tag
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          python -m pip install packaging
          python - "${HEAD_REF#release/v}" dist/*.tar.gz <<'PY'
          import sys
          from pathlib import Path
          from packaging.version import Version
          expected = Version(sys.argv[1])
          built = Version(Path(sys.argv[2]).name.removesuffix(".tar.gz").rsplit("-", 1)[1])
          if built != expected:
              sys.exit(f"built version {built} does not match release tag {expected}")
          print(f"built version {built} matches the release tag")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  test-sdist:
    name: Test sdist (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: build-sdist
    strategy:
      fail-fast: true
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]  # requires-python = ">=3.10,<3.15"

    steps:
      # tests and the pytest settings only, so the tests import the installed sdist rather than the checkout
      - name: Checkout test suite only
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            tests
            pyproject.toml
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install from sdist
        run: python -m pip install pytest dist/*.tar.gz

      # integration tests need the external tools; they run in ci.yml's pixi environment
      - name: Run unit tests (no external tools needed)
        run: pytest -m unit tests

  publish:
    needs: test-sdist
    uses: stajichlab/gh_workflows/.github/workflows/release_publish.yml@v1
    permissions:
      contents: write
    with:
      artifact: sdist  # attach the tested sdist to the GitHub release
      environment: Release  # required reviewers (Settings → Environments) approve tagging and publishing
    secrets:
      token: ${{ secrets.RELEASE_TOKEN }}

  pypi:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/python-publish.yml
    permissions:
      contents: write
      id-token: write
    with:
      tag: ${{ needs.publish.outputs.tag }}
      sdist_artifact: sdist  # publish the sdist test-sdist tested, with a wheel built from it
    secrets: inherit

  conda:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/conda-build.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.publish.outputs.tag }}
    secrets: inherit

  container:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: ./.github/workflows/docker-build.yml
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      tag: ${{ needs.publish.outputs.tag }}

  sync-dev:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    uses: stajichlab/gh_workflows/.github/workflows/sync_dev.yml@v1
    permissions:
      contents: write
      pull-requests: write
