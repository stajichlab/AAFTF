name: Conda package build + publish

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to anaconda.org (stajichlab channel)"
        type: boolean
        default: true
      version:
        description: "Override version (e.g. 0.7.0). Defaults to the latest git tag"
        type: string
        required: false
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install pixi + rattler-build
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          activate-environment: false

      - name: Install rattler-build
        run: pixi global install rattler-build

      - name: Determine version
        id: version
        run: |
          python -m pip install packaging >/dev/null
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            RAW="${{ github.event.release.tag_name }}"
          else
            RAW="$(git describe --tags --abbrev=0)"
          fi
          RAW="${RAW#v}"
          VERSION="$(python -c "import sys; from packaging.version import Version; print(Version(sys.argv[1]))" "$RAW")"
          echo "raw=${RAW}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Patch recipe version
        run: |
          # Only rewrite the context.version line (stopping before the
          # package: block); the jinja package.version reference is left intact.
          sed -i "0,/^package:/s/^  version: .*/  version: ${{ steps.version.outputs.version }}/" ci/recipe/recipe.yaml
          grep -n -A0 "^context:" ci/recipe/recipe.yaml
          grep -n "^  version:" ci/recipe/recipe.yaml

      - name: Build conda package
        run: |
          rattler-build build --recipe ci/recipe \
            -c conda-forge -c bioconda \
            --output-dir dist-conda

      - name: Upload to anaconda.org (stajichlab)
        if: |
          always() &&
          !cancelled() &&
          (github.event_name == 'release' || github.event.inputs.upload == 'true')
        env:
          ANACONDA_API_KEY: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          ls -la dist-conda/noarch/
          rattler-build upload anaconda \
            --owner stajichlab \
            --channel main \
            --force \
            dist-conda/noarch/*.conda
