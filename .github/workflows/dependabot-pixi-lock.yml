name: CI/Update pixi.lock for Dependabot

# Dependabot bumps the dependencies in pyproject.toml but does not know about pixi.lock. The org's shared
# pixi_lock_refresh workflow regenerates the lock file and pushes it to the Dependabot branch so the PR stays
# installable with `pixi install --locked` (the CI integration job).
on:
  pull_request:
    paths: ["pyproject.toml"]

concurrency:
  group: update-pixi-lock-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  update-pixi-lock:
    name: Update pixi.lock
    uses: stajichlab/gh_workflows/.github/workflows/pixi_lock_refresh.yml@v1
    # Dependabot runs get a read-only token by default; writing is needed to push the updated lock file.
    permissions:
      contents: write
