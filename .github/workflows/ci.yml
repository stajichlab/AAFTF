# Continuous integration for every push to main and every pull request:
# lint (pre-commit), unit tests on every supported Python, integration tests with the real tools
# (locked pixi dev environment), and a warnings-as-errors Sphinx build of docs/.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1

  test-unit:
    name: Unit tests (py ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]  # requires-python = ">=3.10,<3.15"
    steps:
      # hatch-vcs derives the version from git tags
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install AAFTF with its test extras
        run: python -m pip install ".[dev]"

      - name: Run unit tests (no external tools needed)
        run: pytest -vv -m unit tests

  test-integration:
    name: Integration tests (real tools, locked pixi dev environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: dev
          locked: true

      - name: Check the environment has what the default pipeline needs
        run: pixi run -e dev AAFTF dependency

      - name: Run the whole test suite, including integration tests
        run: pixi run -e dev pytest -vv tests

  docs:
    name: Docs build (Sphinx, warnings are errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Graphviz (`dot` draws the workflow diagrams)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      - name: Install Sphinx and AAFTF
        run: python -m pip install -r docs/requirements.txt .

      - name: Build the docs
        run: python -m sphinx -b html -W --keep-going -n docs docs/_build/html
