# Continuous integration for every push to main and every pull request:
# lint (pre-commit), unit tests on every supported Python, integration tests with the real tools
# (locked pixi dev environment), and a warnings-as-errors Sphinx build of docs/. The test jobs use the org's shared
# python_test workflow and upload coverage to Codecov (flags pip-<version> and pixi-dev; needs the CODECOV_TOKEN
# secret).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1

  # Shared org workflow (stajichlab/gh_workflows): one job per Python version in its default 3.10-3.14 matrix,
  # matching requires-python = ">=3.10,<3.15"
  test-unit:
    name: Unit tests
    uses: stajichlab/gh_workflows/.github/workflows/python_test.yml@v1
    with:
      pip_install: ".[dev]"
      test_command: pytest -vv -m unit tests --cov --cov-report=xml
      codecov: true
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  test-integration:
    name: Integration tests (real tools, locked pixi dev environment)
    uses: stajichlab/gh_workflows/.github/workflows/python_test.yml@v1
    with:
      installer: pixi
      pixi_environments: '["dev"]'
      setup_command: AAFTF dependency  # check the environment has what the default pipeline needs
      test_command: pytest -vv tests --cov --cov-report=xml
      codecov: true
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Docs build (Sphinx, warnings are errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0  # full history for the version, without old file contents

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Graphviz (`dot` draws the workflow diagrams)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      - name: Install Sphinx and AAFTF
        run: python -m pip install ".[docs]"

      - name: Build the docs
        run: python -m sphinx -b html -W --keep-going -n docs docs/_build/html
