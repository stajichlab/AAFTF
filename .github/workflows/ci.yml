# Continuous integration for every push to main and every pull request:
# lint (pre-commit), unit tests on every supported Python, integration tests with the real tools
# (locked pixi dev environment), and a warnings-as-errors Sphinx build of docs/. The test jobs use the org's shared
# python_test_pip / python_test_pixi workflows and upload coverage to Codecov (flags pip-<version> and pixi-dev; needs the CODECOV_TOKEN
# secret).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the test and docs jobs run. Skipped jobs are reported as passing, so required checks are satisfied:
  # tests are skipped when only docs/README/other non-code files changed, the docs build when nothing under docs/,
  # aaftf/ or pyproject.toml changed. Manual runs (workflow_dispatch) always run both.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # paths-filter lists PR files through the API
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - "aaftf/**"
              - "tests/**"
              - "patches/**"
              - "example/**"
              - "pyproject.toml"
              - "pixi.lock"
              - "ruff.toml"
              - "codecov.yml"
              - ".github/workflows/ci.yml"
            docs:  # autodoc/viewcode read aaftf/, and the docs extra is in pyproject.toml
              - "docs/**"
              - "aaftf/**"
              - "pyproject.toml"
              - ".github/workflows/ci.yml"

  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1

  # Shared org workflow (stajichlab/gh_workflows): one job per Python version, matching requires-python = ">=3.11,<3.14"
  test-unit:
    name: Unit tests
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    uses: stajichlab/gh_workflows/.github/workflows/python_test_pip.yml@v2
    with:
      python_versions: '["3.11", "3.12", "3.13"]'
      pip_install: ".[dev]"
      test_command: pytest -vv -m unit tests --cov --cov-report=xml
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  test-integration:
    name: Integration tests (real tools, locked pixi dev environment)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    uses: stajichlab/gh_workflows/.github/workflows/python_test_pixi.yml@v2
    with:
      environments: '["dev"]'
      # first check the environment has what the default pipeline needs
      test_command: |
        AAFTF dependency
        pytest -vv tests --cov --cov-report=xml
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Docs build (Sphinx, warnings are errors)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0  # full history for the version, without old file contents

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Graphviz (`dot` draws the workflow diagrams)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      - name: Install Sphinx and AAFTF
        run: python -m pip install ".[docs]"

      - name: Build the docs
        run: python -m sphinx -b html -W --keep-going -n docs docs/_build/html
