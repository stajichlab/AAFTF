# recipe.yaml - rattler-build recipe for AAFTF
#
# Build a local conda package:
#   rattler-build build --recipe ci/recipe \
#       --channels conda-forge --channels bioconda \
#       --output-dir dist-conda
#
# `version` below is the single source of truth for both the conda package
# version AND the version recorded in the installed package's metadata
# (read at runtime as aaftf.__version__):
# SETUPTOOLS_SCM_PRETEND_VERSION forces hatch-vcs to record exactly this
# string, so `AAFTF --version` inside the conda package reports the same
# version as the package itself. pyproject.toml derives its version
# dynamically from git tags (see [tool.hatch.version]), so bump this value
# together with the release's git tag (vX.Y.Z).
context:
  name: aaftf
  version: 0.7.0

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  path: ../..
  # .git/, .pixi/, build/ and the large local test reads are excluded
  # automatically: rattler-build honours the repo's .gitignore for path
  # sources (use_gitignore defaults to true).

build:
  number: 0
  # Pure-Python package: build once, install on any platform. The console
  # entry point is declared via [project.scripts] in pyproject.toml, so pip
  # creates the `AAFTF` launcher.
  noarch: python
  script:
    content:
      - python -m pip install . --no-deps --no-build-isolation -vv
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ version }}

requirements:
  host:
    - python
    - pip
    - hatchling
    - hatch-vcs
  run:
    # Same set as the pixi "complete" environment in pyproject.toml (and environment.dev.yml):
    # what the default pipeline needs, then the tools for optional steps and options.
    - python >=3.10,<3.15
    - bbmap >=39.80,<40
    - spades
    - blast
    - sourmash
    - bwa
    - samtools >=1.24,<2
    - minimap2
    - biopython >=1.88
    - psutil >=5
    - matplotlib-base >=3
    - packaging
    - pigz
    - bowtie2
    - fastp
    - trimmomatic
    - megahit
    - unicycler
    - polypolish >=0.7.1,<0.8
    - pypolca >=0.5.0,<0.6
    - freebayes
    - nextpolish2 >=0.2.2,<0.3
    - yak
    - racon
    - mosdepth >=0.3.10
    - novoplasty
    - ncbi-fcs-gx

tests:
  - python:
      imports:
        - aaftf
      pip_check: true
  - script:
      - AAFTF --version
      - AAFTF --help

about:
  homepage: https://github.com/stajichlab/AAFTF
  repository: https://github.com/stajichlab/AAFTF
  license: MIT
  license_file: LICENSE
  summary: Automatic Assembly For The Fungi
  description: |
    AAFTF automates draft fungal genome assembly from Illumina reads
    (optionally with long reads): BBDuk/Trimmomatic/fastp read trimming and
    contaminant filtering, SPAdes/MEGAHIT/Unicycler assembly, vector and
    contaminant screening (BLAST, sourmash, NCBI FCS), duplicate removal,
    optional polishing and mitochondrial assembly, contig sorting and
    renaming, and summary statistics including telomere detection.

extra:
  recipe-maintainers:
    - stajichlab
