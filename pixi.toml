[workspace]
authors = ["Jason Stajich <jasonstajich.phd@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "AAFTF"
platforms = ["linux-64"]
version = "0.7.0"

[tasks]

# ---------------------------------------------------------------------------
# Conda toolchain shared by every environment. Kept in an explicit "common"
# feature (rather than the top-level/implicit default feature) so it can be
# combined with either pypi source below without pixi's always-on default
# feature dragging in both aaftf sources into the same solve at once.
# ---------------------------------------------------------------------------
[feature.common.dependencies]
python = "3.10.*"
samtools = ">=1.23,<2"
biopython = "*"
bwa = "*"
minimap2 = "*"
pilon = "*"
blast = "*"
diamond = "*"
sourmash = "*"
bowtie2 = "*"
trimmomatic = "*"
spades = "*"
fastp = "*"
novoplasty = "*"
ncbi-fcs-gx = "*"
mosdepth = "*"
matplotlib = "*"
pip = "*"
bbmap = ">=39.80,<40"
masurca = ">=4.1.4,<5"
pytest = ">=9.0.3,<10"

# "local": install AAFTF as an editable package from the local checkout
# (used by the "default" environment for development / CI).
[feature.local.pypi-dependencies]
aaftf = { path = ".", editable = true }

# ---------------------------------------------------------------------------
# "release" environment — installs a pinned tagged version from GitHub.
# Used by:  pixi install --environment release
#           docker build --build-arg PIXI_ENV=release ...
# To update the pinned tag, change the `tag` value below and run:
#   pixi install --environment release  (regenerates pixi.lock for that env)
# ---------------------------------------------------------------------------
[feature.release.pypi-dependencies]
aaftf = { git = "https://github.com/stajichlab/AAFTF", tag = "v0.6.2" }

[environments]
default = { features = ["common", "local"] }
release = { features = ["common", "release"] }
