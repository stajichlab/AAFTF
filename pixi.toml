[workspace]
authors = ["Jason Stajich <jasonstajich.phd@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "AAFTF"
platforms = ["linux-64"]
version = "0.7.0"

[tasks]
# Build bowtie2 from source into the active env to fix AVX2 (x86-64-v3)
# runtime fallback in the conda binary. Run once after `pixi install`:
#   pixi run install-bowtie2
# Mirrors the approach used in funannotate.
install-bowtie2 = { cmd = "bash install_scripts/pixi_install_bowtie2.sh", description = "Build bowtie2 from source to fix AVX2 runtime fallback issues" }

# ---------------------------------------------------------------------------
# Conda toolchain shared by every environment. Kept in an explicit "common"
# feature (rather than the top-level/implicit default feature) so it can be
# combined with either pypi source below without pixi's always-on default
# feature dragging in both aaftf sources into the same solve at once.
# ---------------------------------------------------------------------------
[feature.common.dependencies]
python = "3.10.*"
samtools = ">=1.23,<2"
biopython = "*"
taxonkit = "*"
bwa = "*"
minimap2 = "*"
pilon = "*"
blast = "*"
diamond = "*"
sourmash = "*"
trimmomatic = "*"
spades = "*"
fastp = "*"
novoplasty = "*"
megahit = "*"
unicycler = "*"
fastqc = "*"
flye = "*"
racon = "*"
hifiasm = "*"
kraken2 = "*"
ncbi-fcs-gx = "*"
mosdepth = ">=0.3.10"
matplotlib = "*"
pip = "*"
bbmap = ">=39.80,<40"
masurca = ">=4.1.4,<5"
pytest = ">=9.0.3,<10"

[feature.dev.dependencies]
pytest-cov = "*"

[feature.dev.pypi-dependencies]
aaftf = { path = ".", editable = true }

# ---------------------------------------------------------------------------
# "release" environment — installs AAFTF from PyPI/GitHub.
# Used by:  pixi install --environment release
#            docker build --build-arg PIXI_ENV=release ...
#
# Release workflow:
#   1. git tag v0.X.Y && git push origin v0.X.Y
#   2. Update this file: change branch="main" to tag="v0.X.Y"
#   3. pixi install --environment release  (regenerates pixi.lock)
#   4. git add pixi.lock && git commit -m "Bump aaftf to v0.X.Y" && git push
#
# Until step 2 is done, this tracks the main branch (development builds).
# ---------------------------------------------------------------------------
[feature.release.pypi-dependencies]
aaftf = { git = "https://github.com/stajichlab/AAFTF", branch = "main" }

[environments]
default = { features = ["common", "dev"] }
release = { features = ["common", "release"] }
