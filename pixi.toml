[workspace]
authors = ["Jason Stajich <jasonstajich.phd@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "AAFTF"
platforms = ["linux-64"]
version = "0.7.0"

[tasks]

# ---------------------------------------------------------------------------
# Conda toolchain shared by every environment. Kept in an explicit "common"
# feature (rather than the top-level/implicit default feature) so it can be
# combined with either pypi source below without pixi's always-on default
# feature dragging in both aaftf sources into the same solve at once.
# ---------------------------------------------------------------------------
[feature.common.dependencies]
python = "3.10.*"
samtools = ">=1.23,<2"
biopython = "*"
bwa = "*"
minimap2 = "*"
pilon = "*"
blast = "*"
diamond = "*"
sourmash = "*"
bowtie2 = "*"
trimmomatic = "*"
spades = "*"
fastp = "*"
novoplasty = "*"
ncbi-fcs-gx = "*"
mosdepth = ">=0.3.10"
matplotlib = "*"
pip = "*"
bbmap = ">=39.80,<40"
masurca = ">=4.1.4,<5"
pytest = ">=9.0.3,<10"

[feature.dev.dependencies]
pytest-cov = "*"

[feature.dev.pypi-dependencies]
aaftf = { path = ".", editable = true }

# ---------------------------------------------------------------------------
# "release" environment — installs AAFTF from GitHub rather than the local
# checkout. Used by:  pixi install --environment release
#                      docker build --build-arg PIXI_ENV=release ...
# Currently tracks the `main` branch since no v0.7.0 tag exists yet. Once
# v0.7.0 is tagged and released, pin this to `tag = "v0.7.0"` instead (and
# re-pin on each subsequent release) so this environment always installs an
# exact released version, then run:
#   pixi install --environment release  (regenerates pixi.lock for that env)
# ---------------------------------------------------------------------------
[feature.release.pypi-dependencies]
aaftf = { git = "https://github.com/stajichlab/AAFTF", branch = "main" }

[environments]
default = { features = ["common", "dev"] }
release = { features = ["common", "release"] }
