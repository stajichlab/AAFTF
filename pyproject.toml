[project]
name = "AAFTF"
dynamic = ["version"]
authors = [
    { name = "Jason Stajich", email = "jasonstajich.phd@gmail.com" },
    { name = "Jonathan Palmer", email = "nextgen.usfs@gmail.com" },
    { name = "Cheng-Hung Tsai", email = "chenghung.tsai@email.ucr.edu" },
]
maintainers = [
    { name = "Jason Stajich", email = "jasonstajich.phd@gmail.com" },
    { name = "Cheng-Hung Tsai", email = "chenghung.tsai@email.ucr.edu" },
]
description = "Automatic Assembly For The Fungi - for automating genome assembly focused on short reads with cleanup, vector trimming and contam detection, resorting contigs by size and renaming, and summary statistics including telomere detection"
readme = "README.md"
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "biopython>=1.88",
    "matplotlib>=3",
    "packaging",
    "psutil>=5",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
docs = [
    "sphinx>=7,<8",
    "furo",
    "sphinx-autobuild",
]

[project.urls]
Homepage = "https://github.com/stajichlab/AAFTF"
Issues = "https://github.com/stajichlab/AAFTF/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project.scripts]
AAFTF = "aaftf.main:main"

# Version is derived from git tags (vX.Y.Z) plus the short commit hash.
# At runtime, aaftf/__init__.py resolves __version__ via importlib.metadata
# from the installed package's metadata.
[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "guess-next-dev", local_scheme = "node-and-date", fallback_version = "0.0.0+unknown" }

[tool.hatch.build.targets.wheel]
packages = ["aaftf"]

# Patched MaSuRCA POLCA (GPL-3.0; see patches/polca/polca.patch), installed into bin/ for `polish --method polca`
[tool.hatch.build.targets.wheel.shared-scripts]
"patches/polca/aaftf_polca.sh" = "aaftf_polca.sh"
"patches/polca/fix_consensus_from_vcf.pl" = "fix_consensus_from_vcf.pl"

# The sdist carries only what is needed to build and test the package; pyproject.toml,
# README.md and LICENSE are always added by hatchling. Docs, CI, container and dev files stay out.
[tool.hatch.build.targets.sdist]
include = ["/aaftf", "/tests", "/CHANGES.md", "/patches/polca/aaftf_polca.sh", "/patches/polca/fix_consensus_from_vcf.pl", "/patches/polca/polca.patch"]

[tool.coverage.run]
source = ["aaftf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: pure Python tests, no external tools required",
    "integration: requires external bioinformatics tools (minimap2, samtools, mosdepth, etc.)",
]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[tool.pixi.activation.env]
# Keep pixi environments isolated from packages installed with `pip install --user`
PYTHONNOUSERSITE = "1"

# ---------------------------------------------------------------------------
# Top-level dependencies (included in every environment): the external tools
# `AAFTF pipeline` needs with its default settings -- see REQUIRED_TOOLS in
# aaftf/dependency.py. Python packages are not listed here: they come from
# [project] dependencies / extras through the aaftf pypi-dependency below.
# Mirrored by environment.yml.
# ---------------------------------------------------------------------------
[tool.pixi.dependencies]
python = ">=3.10,<3.15"
bbmap = ">=39.80,<40"     # bbduk.sh, shuffle.sh, reformat.sh (brings java)
spades = "*"
blast = "*"
bwa = "*"
samtools = ">=1.24,<2"
minimap2 = "*"
bowtie2 = ">=2.5.5,<3"
# pipeline_long / pipeline_hybrid: flye assembly, racon + polypolish/pypolca polishing
flye = "*"
racon = "*"
polypolish = ">=0.7.1,<0.8"
pypolca = ">=0.5.0,<0.6"
freebayes = "*"
mosdepth = ">=0.3.10"     # depth: the pipelines tag mitochondrial contigs in the final assembly

[tool.pixi.feature.prod.pypi-dependencies]
aaftf = { path = ".", editable = false }

# ---------------------------------------------------------------------------
# "optional" feature: tools only used by optional steps (polish, mito,
# fcs_screen, fcs_gx_purge) or non-default options (trim --method fastp /
# trimmomatic, assemble --method megahit / unicycler, pipeline_short --method megahit /
# unicycler, pipeline_hybrid --method unicycler)
# -- OPTIONAL_TOOLS in aaftf/dependency.py.
# The complete environment (default + optional) is mirrored by environment.dev.yml.
# ---------------------------------------------------------------------------
[tool.pixi.feature.optional.dependencies]
pigz = "*"
sourmash = ">=4.8"       # taxpurge (pipelines run it only with -p/--phylum)
sourmash_plugin_branchwater = ">=0.9.15"  # taxpurge: fastmultigather
fastp = "*"
trimmomatic = "*"
megahit = "*"
unicycler = "*"
nextpolish2 = ">=0.2.2,<0.3"
yak = "*"
novoplasty = "*"
ncbi-fcs-gx = "*"

[tool.pixi.feature.optional.tasks]
# The conda bowtie2 above works but cannot use AVX2 (it falls back from its
# x86-64-v3 build at runtime). For AVX2 speed, rebuild it from source into the
# environment once after installing (this replaces the conda binaries):
#   pixi run -e complete install-bowtie2
# Mirrors the approach used in funannotate.
install-bowtie2 = { cmd = "bash install_scripts/pixi_install_bowtie2.sh", description = "Build bowtie2 from source to fix AVX2 runtime fallback issues" }
install-spades-multiarch = { cmd = "SPADES_ROOT=$CONDA_PREFIX/opt/spades SPADES_BUILD_PATH=$PATH bash install_scripts/install_spades_multiarch.sh", description = "Build SPAdes for x86-64-v2 and v3 with runtime CPU dispatch" }
install-megahit-from-source = { cmd = "MEGAHIT_BUILD_PATH=$PATH bash install_scripts/install_megahit_from_source.sh", description = "Rebuild MEGAHIT from source for older (x86-64-v2) CPUs" }

# ---------------------------------------------------------------------------
# "dev" feature: AAFTF editable with the `dev` and `docs` extras (test, lint
# and docs tools come from [project.optional-dependencies]).
# ---------------------------------------------------------------------------
[tool.pixi.feature.dev.pypi-dependencies]
aaftf = { path = ".", editable = true, extras = ["dev", "docs"] }

[tool.pixi.feature.dev.dependencies]
ruff = "*"
graphviz = "*"           # `dot` for the workflow diagrams (sphinx.ext.graphviz)

[tool.pixi.feature.dev.tasks]
test = "pytest"
docs = "sphinx-build -b html docs docs/_build/html"
docs-serve = "sphinx-autobuild docs docs/_build/html"

[tool.pixi.environments]
default = { features = ["prod"] }                       # default pipeline
complete = { features = ["prod", "optional"] }          # + every optional tool
dev = { features = ["optional", "dev"] }                # + AAFTF editable, test/lint/docs tools
