# Tools needed to run `AAFTF pipeline_short`, `pipeline_long` and `pipeline_hybrid` with their default settings (same as the pixi
# "default" environment in pyproject.toml). For the optional steps and options too,
# use environment.dev.yml.
name: aaftf
channels:
  - conda-forge
  - bioconda
dependencies:
  - python>=3.11,<3.14
  - bbmap>=39.80,<40        # bbduk.sh, shuffle.sh, reformat.sh (brings java)
  - spades
  - blast
  - bwa
  - samtools>=1.24,<2
  - minimap2
  # pipeline_long / pipeline_hybrid: flye assembly, racon + polypolish/pypolca polishing
  - flye
  - racon
  - polypolish>=0.7.1,<0.8
  - pypolca>=0.5.0,<0.6
  - freebayes
  - mosdepth>=0.3.10        # depth: the pipelines tag mitochondrial contigs in the final assembly
  - pigz
  - sourmash>=4.8           # taxpurge (the pipelines run it with -p/--phylum); also in the bioconda recipe
  - sourmash_plugin_branchwater>=0.9.15
  - biopython>=1.88
  - psutil>=5
  - matplotlib-base>=3
  - pip
  - pip:
    - aaftf
